pre-commit:
  jobs:
    - name: biome
      glob: "*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc,css}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: pnpm typecheck

pre-push:
  jobs:
    - name: tests
      group:
        piped: true
        jobs:
          - name: unit
            run: pnpm test
          - name: e2e
            run: pnpm test:e2e
